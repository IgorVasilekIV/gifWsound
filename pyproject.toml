[project]
name = "gifwsound"
version = "0.1.0"
description = "Bot: video to Telegram GIF with sound (H.264 Baseline + hdlr soun->vide patch + sendAnimation)"
authors = [
    { name = "IgorVasilekIV", email = "igorvasilekiv@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "python-dotenv>=1.0",
]

[project.scripts]
gifwsound = "gifwsound.main:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
